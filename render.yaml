databases:
  - name: cocoa-inventory-db
    databaseName: cocoa_inventory
    user: cocoa_admin
    plan: free

services:
  - type: web
    name: cocoa-inventory-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node Backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cocoa-inventory-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
