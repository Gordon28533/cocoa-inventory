services:
  - type: web
    name: cocoa-inventory-backend
    env: node
    region: oregon          # change to "frankfurt" if your users are in Europe/Africa
    plan: free              # upgrade to "starter" ($7/mo) to avoid spin-down
    buildCommand: npm install
    startCommand: node Backend/server.js
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT automatically — do NOT set it here

      # ── Auth ────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false          # set in Render dashboard → Environment

      # ── Database (MySQL — e.g. from Railway or Aiven) ───────────────────────
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false

      # ── CORS — set to your Vercel frontend URL ───────────────────────────────
      # Example: https://cocoa-inventory.vercel.app
      # Comma-separate multiple origins if needed
      - key: CORS_ORIGIN
        sync: false
